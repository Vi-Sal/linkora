services:
  - type: web
    name: linkora
    runtime: docker
    branch: main
    autoDeployTrigger: commit
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: MAX_CONCURRENT_JOBS
        value: "1"
      - key: ENABLE_BATCH_EXPORT
        value: "false"
      - key: DIRECT_MEDIA_HOSTS
        value: media.w3.org,interactive-examples.mdn.mozilla.net
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
